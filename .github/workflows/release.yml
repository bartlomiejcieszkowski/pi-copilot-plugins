name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack

      - name: Bump version
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version

      - name: Commit version bump
        run: |
          git config user.name "Release Bot"
          git config user.email "release@pi-copilot-plugins.dev"
          git add package.json
          git commit -m "chore: version bump ${{ github.event.inputs.bump }}"
          git tag "v$(node -p \"require('./package.json').version\")"

      - name: Push changes
        run: |
          git push origin main
          git push origin --tags

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v$(node -p \"require('./package.json').version\")"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
